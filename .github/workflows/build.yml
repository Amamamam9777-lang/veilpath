
name: Veilpath - Cloud Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Check Xcode project
        run: |
          xcodebuild -list \
            -project Veilpath.xcodeproj

      - name: Validate property lists
        run: |
          find . -name "*.plist" \
            -not -path "./.git/*" \
            -print0 | while IFS= read -r -d '' file; do
              plutil -lint "$file"
          done

      - name: Check Swift formatting
        run: |
          swift-format lint --recursive \
            --strict .
