name: Veilpath – Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-unsigned-ipa:
    runs-on: macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Show schemes
        run: |
          xcodebuild -list -project Veilpath.xcodeproj

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Veilpath.xcodeproj \
            -scheme Veilpath \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Veilpath.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            clean archive

      - name: Package IPA (unsigned)
        run: |
          APP_PATH="$RUNNER_TEMP/Veilpath.xcarchive/Products/Applications/Veilpath.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Veilpath-unsigned.ipa Payload
          ls -lh Veilpath-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veilpath-unsigned-ipa
          path: ${{ runner.temp }}/Veilpath-unsigned.ipa
          if-no-files-found: error
          retention-days: 7